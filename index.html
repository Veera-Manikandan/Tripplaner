<!DOCTYPE html>

<!--

  Trip Planner — single-file build

  ---------------------------------

  What this is: a free-form trip description goes in, an LLM returns a

  structured JSON itinerary, and the app renders it as an interactive,

  stateful set of day cards (expand, reorder, remove stops).

  Why one file: this was built to be dropped anywhere and opened directly —

  no build step, no npm install. React, Babel (JSX-in-browser) and fonts

  load from CDNs; everything else is inline below.

  Honest limitation (read before shipping this for real): the API key is

  entered client-side and used directly from the browser. That's fine for

  a local demo but is exactly what the original brief asks you NOT to do

  in production — in a real deployment this fetch call belongs behind a

  small backend/serverless function so the key never reaches the browser.

  Swapping it out is a one-line change: point callModel() at your own

  "/api/plan" endpoint instead of the provider URL below.

  This version uses Google's Gemini API directly for local/demo use.

  It defaults to Gemini 3.6 Flash. For production, put the Gemini call

  behind a backend so the API key is never exposed in the browser.

-->

<html lang="en">

<style>

  /* states */

  .error-panel {

  .error-panel .display { font-size: 17px; margin: 0 0 6px; color: var(--brick); }

  details.raw { margin-top: 10px; }

  details.raw pre {

  /* itinerary */

  .trip-head {

  .day-card {

<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useCallback } = React;

const STORAGE_KEY = "trip-planner:session:v1";

const SETTINGS_KEY = "trip-planner:settings:v2-gemini";

const REQUEST_TIMEOUT_MS = 45000;

const EXAMPLES = [

  "5 days in Lisbon, slow travel, lots of food and viewpoints",

  "Weekend in Kyoto, temples + one day trip, budget-friendly",

  "7-day road trip through New Zealand's South Island, hiking focus",

];

const SYSTEM_PROMPT = `You are a travel planning assistant embedded in an app. Given a free-form trip description, respond with ONLY a raw JSON object — no markdown fences, no commentary — matching exactly this shape:

{

  "title": string,               // short trip title, e.g. "Lisbon, Slow & Scenic"

  "destination": string,

  "days": [

    {

      "day": number,             // 1-indexed

      "theme": string,           // short theme, e.g. "Old Town & Riverfront"

      "stops": [

        {

          "id": string,          // unique short id, e.g. "d1s1"

          "time": string,        // e.g. "9:00 AM" or "Morning"

          "name": string,

          "type": "sight" | "food" | "activity" | "transport" | "rest",

          "description": string // 1-2 concrete sentences, specific to the place

        }

      ]

    }

  ]

}

Rules: infer the number of days from the request (default 3 if unclear). 3 to 6 stops per day. Be concrete and specific to the actual destination, never generic filler. Output raw JSON only.`;

function safeUUID() {

  return Math.random().toString(36).slice(2, 9);

}

// ---- validation: don't trust the model's shape ----

function validateItinerary(data) {

  if (!data || typeof data !== "object") return "Response wasn't a JSON object.";

  if (typeof data.title !== "string" || !data.title.trim()) return "Missing a trip title.";

  if (!Array.isArray(data.days) || data.days.length === 0) return "No days were returned.";

  for (const day of data.days) {

    if (typeof day.day !== "number") return "A day is missing its day number.";

    if (!Array.isArray(day.stops) || day.stops.length === 0) return `Day ${day.day} has no stops.`;

    for (const stop of day.stops) {

      if (typeof stop.name !== "string" || !stop.name.trim()) return `Day ${day.day} has a stop with no name.`;

    }

  }

  return null;

}

// fill in anything missing/malformed at the field level rather than

// rejecting a mostly-good response outright

function normalizeItinerary(data) {

  return {

    title: data.title.trim(),

    destination: typeof data.destination === "string" ? data.destination : "",

    days: data.days.map((day, di) => ({

      day: typeof day.day === "number" ? day.day : di + 1,

      theme: typeof day.theme === "string" && day.theme.trim() ? day.theme : `Day ${di + 1}`,

      stops: day.stops.map((s, si) => ({

        id: typeof s.id === "string" && s.id ? s.id : `d${di + 1}s${si + 1}-${safeUUID()}`,

        time: typeof s.time === "string" ? s.time : "",

        name: s.name.trim(),

        type: ["sight", "food", "activity", "transport", "rest"].includes(s.type) ? s.type : "activity",

        description: typeof s.description === "string" ? s.description : "",

      })),

    })),

  };

}

function extractJson(raw) {

  // models sometimes wrap JSON in ```json fences or add stray prose; try the

  // straightforward parse first, then fall back to grabbing the outermost braces

  try { return JSON.parse(raw); } catch (e) {}

  const match = raw.match(/**\{**[\s\S]***\}**/);

  if (match) {

    try { return JSON.parse(match[0]); } catch (e) {}

  }

  return null;

}

async function callModel({ apiKey, model, prompt, signal }) {
  const endpoint =
    `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;

  const res = await fetch(endpoint, {
    method: "POST",
    signal,
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": apiKey,
    },
    body: JSON.stringify({
      systemInstruction: {
        parts: [{ text: SYSTEM_PROMPT }],
      },
      contents: [
        {
          role: "user",
          parts: [{ text: prompt }],
        },
      ],
      generationConfig: {
        responseMimeType: "application/json",
      },
    }),
  });

  if (!res.ok) {
    let detail = "";
    try {
      const errorData = await res.json();
      detail =
        errorData?.error?.message ||
        errorData?.message ||
        "";
    } catch (e) {}

    throw new Error(detail || `Gemini request failed (${res.status}).`);
  }

  const data = await res.json();

  if (data?.promptFeedback?.blockReason) {
    throw new Error(`Gemini blocked the request: ${data.promptFeedback.blockReason}`);
  }

  const content = (data?.candidates?.[0]?.content?.parts || [])
    .map((part) => part?.text || "")
    .join("")
    .trim();

  if (!content) throw new Error("EMPTY_RESPONSE");

  return content;
}

function Icon({ name }) {

  const paths = {

    settings: "M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7ZM19.4 13a7.4 7.4 0 0 0 .06-1 7.4 7.4 0 0 0-.06-1l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-4l-.4 2.4a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.4 7.4 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13Z",

    moon: "M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z",

    sun: "M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4 4.2 19.8M19.8 4.2l-1.4 1.4M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z",

    chevron: "M6 9l6 6 6-6",

    up: "M12 19V5M5 12l7-7 7 7",

    down: "M12 5v14M19 12l-7 7-7-7",

    close: "M6 6l12 12M18 6 6 18",

  };

  return (

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      <path d={paths[name]} />

    </svg>

  );

}

function EmptyState({ onPick }) {

  return (

    <div className="state-panel">

      <div className="display">Where to?</div>

      <p>Describe a trip — destination, length, pace, interests — and get a day-by-day plan you can rearrange to fit.</p>

      <div className="examples">

        {EXAMPLES.map((ex) => (

          <button key={ex} className="example-chip" onClick={() => onPick(ex)}>{ex}</button>

        ))}

      </div>

    </div>

  );

}

function LoadingState() {

  return (

    <div className="state-panel">

      <div className="spinner" />

      <div className="display">Planning your trip…</div>

      <p>Usually takes a few seconds. If the model stalls, this will time out on its own and let you retry.</p>

    </div>

  );

}

function ErrorState({ message, rawText, onRetry, onEdit }) {

  return (

    <div className="error-panel">

      <div className="display">That didn't come back right</div>

      <p>{message}</p>

      <div className="error-actions">

        <button className="btn secondary" onClick={onRetry}>Try again</button>

        <button className="btn ghost" onClick={onEdit}>Edit prompt</button>

      </div>

      {rawText ? (

        <details className="raw">

          <summary>Show raw model output</summary>

          <pre>{rawText}</pre>

        </details>

      ) : null}

    </div>

  );

}

function Stop({ stop, index, total, onRemove, onMove }) {

  return (

    <div className="stop">

      <div className="stop-time">{stop.time}</div>

      <div className="stop-main">

        <div className="stop-name-row">

          <span className="stop-name">{stop.name}</span>

          <span className={`pill ${stop.type}`}>{stop.type}</span>

        </div>

        {stop.description ? <div className="stop-desc">{stop.description}</div> : null}

      </div>

      <div className="stop-actions">

        <button className="mini-btn" aria-label="Move up" disabled={index === 0} onClick={() => onMove(index, -1)}><Icon name="up" /></button>

        <button className="mini-btn" aria-label="Move down" disabled={index === total - 1} onClick={() => onMove(index, 1)}><Icon name="down" /></button>

        <button className="mini-btn remove" aria-label="Remove stop" onClick={() => onRemove(index)}><Icon name="close" /></button>

      </div>

    </div>

  );

}

function DayCard({ day, dayIndex, defaultOpen, onRemoveStop, onMoveStop }) {

  const [open, setOpen] = useState(defaultOpen);

  return (

    <div className="day-card">

      <button className="day-head" onClick={() => setOpen((o) => !o)} aria-expanded={open}>

        <div className="day-num">{day.day}</div>

        <div className="day-head-text">

          <div className="theme">{day.theme}</div>

          <div className="count">{day.stops.length} stop{day.stops.length === 1 ? "" : "s"}</div>

        </div>

        <span className={`chevron ${open ? "open" : ""}`}><Icon name="chevron" /></span>

      </button>

      {open ? (

        <div className="stop-list">

          {day.stops.length === 0 ? (

            <p style={{ color: "var(--ink-soft)", fontSize: 13.5, padding: "10px 6px" }}>

              No stops left for this day.

            </p>

          ) : (

            day.stops.map((stop, i) => (

              <Stop

                key={stop.id}

                stop={stop}

                index={i}

                total={day.stops.length}

                onRemove={(idx) => onRemoveStop(dayIndex, idx)}

                onMove={(idx, dir) => onMoveStop(dayIndex, idx, dir)}

              />

            ))

          )}

        </div>

      ) : null}

    </div>

  );

}

function SettingsPanel({ settings, onChange, onClose }) {
  return (
    <div className="settings">
      <div className="field-row">
        <div className="field">
          <label htmlFor="apiKey">Gemini API key</label>
          <input
            id="apiKey"
            type="password"
            placeholder="Paste your Gemini API key"
            value={settings.apiKey}
            onChange={(e) => onChange({ ...settings, apiKey: e.target.value })}
          />
        </div>

        <div className="field">
          <label htmlFor="model">Gemini model</label>
          <input
            id="model"
            type="text"
            value={settings.model}
            onChange={(e) => onChange({ ...settings, model: e.target.value })}
          />
        </div>
      </div>

      <p className="settings-note">
        This app calls Google's Gemini API directly. The API key is stored in
        this browser's localStorage and is sent only to Google's Gemini API
        endpoint. This is suitable for a local/demo app. For a real public
        deployment, move the Gemini call behind a backend so the key never
        reaches the browser.
      </p>

      <div>
        <button className="btn secondary" onClick={onClose}>Done</button>
      </div>
    </div>
  );
}

function App() {

  const [prompt, setPrompt] = useState("");

  const [status, setStatus] = useState("idle"); // idle | loading | error | success

  const [itinerary, setItinerary] = useState(null);

  const [errorMsg, setErrorMsg] = useState("");

  const [rawText, setRawText] = useState("");

  const [showSettings, setShowSettings] = useState(false);

  const [dark, setDark] = useState(false);

  const [settings, setSettings] = useState({
    apiKey: "",
    model: "gemini-3.8-flash",
  });

  const requestIdRef = useRef(0);

  const abortRef = useRef(null);

  // load persisted session + settings + theme once

  useEffect(() => {

    try {

      const savedSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");

      if (savedSettings) setSettings((s) => ({ ...s, ...savedSettings }));

      const savedSession = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

      if (savedSession?.itinerary) {

        setItinerary(savedSession.itinerary);

        setPrompt(savedSession.prompt || "");

        setStatus("success");

      }

      const savedTheme = localStorage.getItem("trip-planner:theme");

      if (savedTheme === "dark") setDark(true);

    } catch (e) { /* corrupted storage — ignore, start fresh */ }

  }, []);

  useEffect(() => {

    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

    localStorage.setItem("trip-planner:theme", dark ? "dark" : "light");

  }, [dark]);

  useEffect(() => {

    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));

  }, [settings]);

  const persistSession = useCallback((nextItinerary, nextPrompt) => {

    try {

      localStorage.setItem(STORAGE_KEY, JSON.stringify({ itinerary: nextItinerary, prompt: nextPrompt }));

    } catch (e) { /* storage full/unavailable — non-fatal */ }

  }, []);

  const runGeneration = useCallback(async (text) => {

    if (!text.trim()) return;

    if (!settings.apiKey.trim()) {

      setShowSettings(true);

      setStatus("error");

      setErrorMsg("Add an API key in settings first — nothing gets sent without one.");

      setRawText("");

      return;

    }

    const myRequestId = ++requestIdRef.current;

    if (abortRef.current) abortRef.current.abort();

    const controller = new AbortController();

    abortRef.current = controller;

    const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    setStatus("loading");

    setErrorMsg("");

    setRawText("");

    try {

      const content = await callModel({

        apiKey: settings.apiKey,

        baseUrl: settings.baseUrl,

        model: settings.model,

        prompt: text,

        signal: controller.signal,

      });

      // a newer request has since started — drop this stale result entirely

      if (myRequestId !== requestIdRef.current) return;

      const parsed = extractJson(content);

      if (!parsed) {

        setStatus("error");

        setErrorMsg("The model's response wasn't valid JSON.");

        setRawText(content);

        return;

      }

      const shapeError = validateItinerary(parsed);

      if (shapeError) {

        setStatus("error");

        setErrorMsg(`The response didn't match the expected format: ${shapeError}`);

        setRawText(JSON.stringify(parsed, null, 2));

        return;

      }

      const normalized = normalizeItinerary(parsed);

      setItinerary(normalized);

      setStatus("success");

      persistSession(normalized, text);

    } catch (err) {

      if (myRequestId !== requestIdRef.current) return; // superseded — ignore

      setStatus("error");

      if (err.name === "AbortError") {

        setErrorMsg("The request timed out. The model may be slow or unreachable right now.");

      } else if (err.message === "EMPTY_RESPONSE") {

        setErrorMsg("The model returned an empty response.");

      } else {

        setErrorMsg(err.message || "Something went wrong calling the model.");

      }

      setRawText("");

    } finally {

      clearTimeout(timeout);

    }

  }, [settings, persistSession]);

  const handleRemoveStop = (dayIndex, stopIndex) => {

    setItinerary((prev) => {

      const next = structuredClone(prev);

      next.days[dayIndex].stops.splice(stopIndex, 1);

      persistSession(next, prompt);

      return next;

    });

  };

  const handleMoveStop = (dayIndex, stopIndex, dir) => {

    setItinerary((prev) => {

      const next = structuredClone(prev);

      const stops = next.days[dayIndex].stops;

      const target = stopIndex + dir;

      if (target < 0 || target >= stops.length) return prev;

      [stops[stopIndex], stops[target]] = [stops[target], stops[stopIndex]];

      persistSession(next, prompt);

      return next;

    });

  };

  const handleStartOver = () => {

    setItinerary(null);

    setStatus("idle");

    setPrompt("");

    setErrorMsg("");

    localStorage.removeItem(STORAGE_KEY);

  };

  return (

    <div className="shell">

      <header className="topbar">

        <div className="brand">

          <div className="display">Trip Planner</div>

          <div className="tag">Describe a trip. Get a plan you can actually rearrange.</div>

        </div>

        <div className="topbar-actions">

          <button className="icon-btn" aria-label="Toggle theme" onClick={() => setDark((d) => !d)}>

            <Icon name={dark ? "sun" : "moon"} />

          </button>

          <button className="icon-btn" aria-label="Settings" onClick={() => setShowSettings((s) => !s)}>

            <Icon name="settings" />

          </button>

        </div>

      </header>

      {showSettings && (

        <SettingsPanel settings={settings} onChange={setSettings} onClose={() => setShowSettings(false)} />

      )}

      <div className="composer">

        <textarea

          placeholder="e.g. 4 days in Mexico City, food-focused, one day trip to Teotihuacan…"

          value={prompt}

          onChange={(e) => setPrompt(e.target.value)}

        />

        <div className="composer-row">

          <span className="hint">{status === "loading" ? "Generating…" : "Free-form — as much or as little detail as you like."}</span>

          <button className="btn" disabled={status === "loading" || !prompt.trim()} onClick={() => runGeneration(prompt)}>

            {itinerary ? "Regenerate" : "Plan trip"}

          </button>

        </div>

      </div>

      {status === "idle" && !itinerary && <EmptyState onPick={(ex) => setPrompt(ex)} />}

      {status === "loading" && <LoadingState />}

      {status === "error" && (

        <ErrorState

          message={errorMsg}

          rawText={rawText}

          onRetry={() => runGeneration(prompt)}

          onEdit={() => setStatus(itinerary ? "success" : "idle")}

        />

      )}

      {itinerary && status !== "loading" && (

        <React.Fragment>

          <div className="trip-head">

            <div>

              <h2>{itinerary.title}</h2>

              {itinerary.destination ? <div className="sub">{itinerary.destination}</div> : null}

            </div>

            <div className="trip-head-actions">

              <button className="btn ghost" onClick={handleStartOver}>Start over</button>

            </div>

          </div>

          {itinerary.days.map((day, i) => (

            <DayCard

              key={day.day}

              day={day}

              dayIndex={i}

              defaultOpen={i === 0}

              onRemoveStop={handleRemoveStop}

              onMoveStop={handleMoveStop}

            />

          ))}

        </React.Fragment>

      )}

      <div className="footer-note">Saved locally in this browser — reload the page and your last plan is still here.</div>

    </div>

  );

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>

</html>
